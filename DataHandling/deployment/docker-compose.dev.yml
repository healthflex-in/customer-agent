version: '3.8'

# Development version with code mounted as volume for instant updates
# Use this with update-fast.sh for ultra-fast code updates without rebuilds

services:
  healthflex-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthflex-customer-agent-dev
    ports:
      - "8001:8000"
    env_file:
      - ./DataHandling/.env
    environment:
      # Google Cloud Credentials paths (not in .env)
      - GOOGLE_APPLICATION_CREDENTIALS=config/google_key.json
      - GEMINI_LLM_SERVICE_CREDENTIALS=config/gemini_key.json
      
      # Database paths
      - CHROMA_DB_PATH=/app/db/vector db/chroma db collective
    
    volumes:
      # Mount code directory for instant updates (no rebuild needed)
      - ./DataHandling:/app:rw

      # Persist audio files, transcripts, and cache
      - ./DataHandling_dev/audio_files:/app/audio_files
      - ./DataHandling_dev/transcripts:/app/transcripts
      - ./DataHandling_dev/tts_cache:/app/tts_cache
      - ./DataHandling_dev/output:/app/output
      - ./DataHandling_dev/received_audio:/app/received_audio

      # Persist vector database
      - ./DataHandling_dev/db:/app/db

      # Mount config files (Google credentials) - read only
      - ./DataHandling/config:/app/config:ro
    
    restart: unless-stopped
    
    networks:
      - healthflex-network
    
    # Resource limits (adjust based on your EC2 instance)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  healthflex-network:
    driver: bridge

