version: '3.8'

services:
  healthflex-agent:
    build:
      context: ../..
      dockerfile: DataHandling/deployment/Dockerfile
    container_name: healthflex-customer-agent
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ./DataHandling/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=config/google_key.json
      - GEMINI_LLM_SERVICE_CREDENTIALS=config/gemini_key.json
      - CHROMA_DB_PATH=/app/db/vector/chroma_db_collective
      - PYTHONPATH=/app
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
    volumes:
      - ./DataHandling:/app:rw
      - ./DataHandling/audio_files:/app/audio_files
      - ./DataHandling/transcripts:/app/transcripts
      - ./DataHandling/tts_cache:/app/tts_cache
      - ./DataHandling/output:/app/output
      - ./DataHandling/received_audio:/app/received_audio
      - ./DataHandling/db:/app/db
      - ./DataHandling/config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - healthflex-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  healthflex-network:
    driver: bridge
