version: '3.8'

services:
  healthflex-agent:
    build:
      context: ../..
      dockerfile: DataHandling/deployment/Dockerfile
    container_name: healthflex-customer-agent
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ./DataHandling/.env
    environment:
      # Google Cloud Credentials paths (not in .env)
      - GOOGLE_APPLICATION_CREDENTIALS=config/google_key.json
      - GEMINI_LLM_SERVICE_CREDENTIALS=config/gemini_key.json

      # Database paths
      - CHROMA_DB_PATH=/app/db/vector/chroma_db_collective
      - PYTHONPATH=/app

      # Langfuse LLM observability (set these to enable tracing)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    
    volumes:
      # Mount code directory for instant updates (no rebuild needed for code changes)
      # This allows update-fast.sh to work without rebuilding the image
      - ./DataHandling:/app:rw
      
      # Persist audio files, transcripts, and cache
      - ./DataHandling/audio_files:/app/audio_files
      - ./DataHandling/transcripts:/app/transcripts
      - ./DataHandling/tts_cache:/app/tts_cache
      - ./DataHandling/output:/app/output
      - ./DataHandling/received_audio:/app/received_audio
      
      # Persist vector database
      - ./DataHandling/db:/app/db
      
      # Mount config files (Google credentials) - read only
      - ./DataHandling/config:/app/config:ro
    
    restart: unless-stopped
    
    networks:
      - healthflex-network
    
    # Resource limits (adjust based on your EC2 instance)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  healthflex-network:
    driver: bridge

