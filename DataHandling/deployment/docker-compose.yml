services:
  healthflex-agent:
    build:
      context: ../..
      dockerfile: DataHandling/deployment/Dockerfile
    container_name: healthflex-customer-agent
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=config/google_key.json
      - CHROMA_DB_PATH=/app/db/vector/chroma_db_collective
      - PYTHONPATH=/app
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      - LANGFUSE_CAPTURE_CONTENT=${LANGFUSE_CAPTURE_CONTENT:-false}
      - OBSERVABILITY_HASH_KEY=${OBSERVABILITY_HASH_KEY:-}
    volumes:
      - ../audio_files:/app/audio_files
      - ../transcripts:/app/transcripts
      - ../output:/app/output
      - ../received_audio:/app/received_audio
      - ../db:/app/db
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - healthflex-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  healthflex-network:
    driver: bridge
